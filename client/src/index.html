<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A listicle web app that teaches eight essential Git workflows.">
    <title>Ultimate Git Guide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="container">
        <a href="/" class="site-title">Ultimate Git Guide</a>
        <a href="/">Home</a>
      </nav>
    </header>

    <main class="container">
      <section id="list-view">
        <div class="section-header">
          <div>
            <h1>Git Topics</h1>
            <p>Eight practical workflows for learning Git with confidence.</p>
          </div>
        </div>

        <form class="search-bar" id="search-form">
          <label for="attribute-filter">
            Search by
            <select id="attribute-filter" name="attribute">
              <option value="all">Any attribute</option>
              <option value="title">Title</option>
              <option value="category">Category</option>
              <option value="difficulty">Difficulty</option>
              <option value="command">Command</option>
            </select>
          </label>
          <label for="search-input">
            Keyword
            <input id="search-input" name="search" type="search" placeholder="Try Basics, git commit, or Recovery">
          </label>
        </form>

        <p class="status-message" id="list-status">Loading guides...</p>
        <div class="guide-grid" id="guide-grid"></div>
      </section>

      <section id="detail-view" hidden>
        <p><a href="/" id="back-link">Back to all topics</a></p>
        <article class="detail-page" id="detail-card"></article>
      </section>

      <section class="not-found" id="not-found-view" hidden>
        <h1>404</h1>
        <p>The page you are looking for does not exist.</p>
        <a href="/" role="button">Return home</a>
      </section>
    </main>
  </body>
</html>
